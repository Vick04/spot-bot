<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SPOT-BOT - Top 10 Gainers</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <div class="header-left">
        <h1>🤖 SPOT-BOT</h1>
        <p class="subtitle">Top 10 Gainers (1h)</p>
      </div>
      <div class="header-right">
        <div class="connection-status" id="connectionStatus">
          <span class="status-dot disconnected"></span>
          <span class="status-text">Disconnected</span>
        </div>
      </div>
    </header>

    <!-- Top 10 Gainers -->
    <section class="gainers-section">
      <h2>🔝 Top 10 Gainers (Last Hour)</h2>
      <div class="gainers-list" id="gainers">
        <div class="loading">Loading gainers...</div>
      </div>
    </section>

    <!-- Debug Info -->
    <section class="debug-section">
      <h2>📊 Debug Info</h2>
      <div class="debug-info" id="debugInfo">
        <p>Waiting for data...</p>
      </div>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
