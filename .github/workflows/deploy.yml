# .github/workflows/deploy.yml
name: Deploy spot-bot to DigitalOcean

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p 22 -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts 2>/dev/null
          ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy
        run: |
          ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=no \
              -p 22 \
              ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} \
              'set -e
               cd /opt/spot-bot
               git pull origin main

               # Create .env file with API URL for client build
               cat > .env.client << EOF
               VITE_API_URL=${{ secrets.VITE_API_URL }}
               EOF

               # Build with environment variable
               export VITE_API_URL=${{ secrets.VITE_API_URL }}
               docker compose up -d --build
               docker image prune -f
               echo "Deploy complete"'

      - name: Health check
        run: |
          sleep 15
          curl --fail --silent \
            http://${{ secrets.SERVER_IP }}:3131/api/status \
            && echo "API is up" || echo "API health check failed"