services:

  # -- PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: spotbot_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: spotbot_user
      POSTGRES_PASSWORD: spotbot_pass
      POSTGRES_DB: spotbot
    ports:
      - "5432:5432"
    volumes:
      - spotbot_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spotbot_user -d spotbot"]
      interval: 5s
      timeout: 5s
      retries: 10

  # -- DB migrations (runs once on startup, then exits)
  migrate:
    build: .
    container_name: spotbot_migrate
    restart: "no"
    environment:
      DATABASE_URL: postgresql://spotbot_user:spotbot_pass@postgres:5432/spotbot
    command: ["npm", "run", "migrate"]
    depends_on:
      postgres:
        condition: service_healthy

  # -- Unified Live Trading Bot + API Server
  # Single container that runs both live engine and API server
  bot:
    build: .
    container_name: spotbot_bot
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://spotbot_user:spotbot_pass@postgres:5432/spotbot
      NODE_ENV: production
      BINANCE_API_KEY: ${BINANCE_API_KEY:-}
      BINANCE_API_SECRET: ${BINANCE_API_SECRET:-}
      API_PORT: 3131
    command: ["node", "dist/entries/unified.js"]
    ports:
      - "3131:3131"
    depends_on:
      migrate:
        condition: service_completed_successfully
    stop_signal: SIGTERM
    stop_grace_period: 15s

  # -- React client (Bun + Vite + Tailwind → Nginx)
  client:
    build:
      context: ./client
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3131/api}
    container_name: spotbot_client
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - bot

volumes:
  spotbot_pgdata:
    driver: local
