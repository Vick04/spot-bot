services:

  # -- PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: spotbot_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: spotbot_user
      POSTGRES_PASSWORD: spotbot_pass
      POSTGRES_DB: spotbot
    ports:
      - "5432:5432"
    volumes:
      - spotbot_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spotbot_user -d spotbot"]
      interval: 5s
      timeout: 5s
      retries: 10

  # -- DB migrations (runs once on startup, then exits)
  migrate:
    build: .
    container_name: spotbot_migrate
    restart: "no"
    environment:
      DATABASE_URL: postgresql://spotbot_user:spotbot_pass@postgres:5432/spotbot
    command: ["npm", "run", "migrate"]
    depends_on:
      postgres:
        condition: service_healthy

  # -- Live trading bot
  live:
    build: .
    container_name: spotbot_live
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://spotbot_user:spotbot_pass@postgres:5432/spotbot
      NODE_ENV: production
    command: ["node", "dist/live.js"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    stop_signal: SIGTERM
    stop_grace_period: 15s

  # -- Dashboard API
  api:
    build: .
    container_name: spotbot_api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://spotbot_user:spotbot_pass@postgres:5432/spotbot
      NODE_ENV: production
      API_PORT: 3131
    command: ["node", "dist/api/server.js"]
    ports:
      - "3131:3131"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  spotbot_pgdata:
    driver: local
